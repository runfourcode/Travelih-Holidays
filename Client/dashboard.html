<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c0d0f">
  <title>Client portal | Travel(e)sh Holidays</title>
  <style>
    :root{color-scheme:dark;--bg:#0c0d0f;--panel:#15171a;--text:#f7f7f7;--muted:#a7abb2;--orange:#f58220;--orange2:#ffad57;--line:rgba(255,255,255,.1)}
    *{box-sizing:border-box}
    body{min-height:100vh;min-height:100svh;margin:0;padding:24px;display:grid;place-items:center;background:radial-gradient(ellipse at 10% 8%,rgba(245,130,32,.12),transparent 34%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .page{position:relative;isolation:isolate;overflow:hidden;width:min(100%,760px);padding:clamp(30px,7vw,72px);border:1px solid var(--line);border-radius:26px;background:linear-gradient(145deg,rgba(255,255,255,.025),transparent 60%),var(--panel);box-shadow:0 28px 90px rgba(0,0,0,.4)}
    .page:after{position:absolute;z-index:-1;right:-115px;bottom:-190px;width:400px;height:400px;border:1px solid rgba(245,130,32,.18);border-radius:50%;content:""}
    .brand{display:flex;align-items:center;gap:12px;font-size:.92rem;font-weight:900;letter-spacing:.04em}
    .mark{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(135deg,var(--orange),var(--orange2));color:#17110c}
    .brand small{display:block;margin-top:3px;color:var(--muted);font-size:.64rem;letter-spacing:.14em}
    .eyebrow{margin:56px 0 12px;color:var(--orange2);font-size:.72rem;font-weight:850;letter-spacing:.18em;text-transform:uppercase}
    h1{max-width:560px;margin:0;font-size:clamp(2.35rem,7vw,4.4rem);line-height:1.02;letter-spacing:-.06em}
    h1 span{color:var(--orange)}
    .message{max-width:500px;margin:18px 0 0;color:var(--muted);font-size:1rem;line-height:1.75}
    @media(max-width:600px){body{padding:16px}.page{border-radius:20px}.eyebrow{margin-top:44px}}
  </style>
</head>
<body>
  <main class="page">
    <div class="brand"><span class="mark" aria-hidden="true">TH</span><span>TRAVELESH HOLIDAYS<small>DELHI CANTT. · EVERY JOURNEY, ELEVATED</small></span></div>
    <p class="eyebrow">CLIENT PORTAL</p>
    <h1>Your journey<br><span>starts here.</span></h1>
    <p class="message">This portal is being kept simple for now. Please check back later for updates.</p>
  </main>
</body>
</html>
