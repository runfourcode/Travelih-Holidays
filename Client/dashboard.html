<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0c0d0f" />
  <title>Client portal | Travel(e)sh Holidays</title>
  <style>
    :root{color-scheme:dark;--bg:#0c0d0f;--panel:#15171a;--panel-alt:#1b1d21;--text:#f7f7f7;--muted:#a7abb2;--orange:#f58220;--orange-2:#ffad57;--green:#7ee7a6;--red:#fca5a5;--blue:#8ec5ff;--line:rgba(255,255,255,.08);--shadow:0 22px 60px rgba(0,0,0,.28)}
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{min-height:100vh;font-family:Inter,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at top left,rgba(245,130,32,.08),transparent 28%),var(--bg)}
    a{color:inherit;text-decoration:none}
    button,select,input,textarea{font:inherit}
    .container{width:min(1180px,calc(100% - 32px));margin:0 auto}
    .topbar{position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);background:rgba(12,13,15,.9);backdrop-filter:blur(14px)}
    .topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 0}
    .brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:-.04em}
    .brand-mark{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--orange),var(--orange-2));color:#17110c;font-weight:900}
    .header-actions{display:flex;align-items:center;gap:12px}
    .ghost-btn,.primary-btn,.danger-btn{border:1px solid var(--line);border-radius:999px;padding:10px 16px;cursor:pointer;transition:.2s ease}
    .ghost-btn{background:rgba(255,255,255,.02);color:var(--text)}
    .primary-btn{background:linear-gradient(135deg,var(--orange),var(--orange-2));border:0;color:#17110c;font-weight:800}
    .danger-btn{background:rgba(252,165,165,.08);color:var(--red);border-color:rgba(252,165,165,.25)}
    .main{padding:28px 0 52px}
    .hero{display:flex;justify-content:space-between;gap:18px;align-items:center;background:linear-gradient(135deg,rgba(245,130,32,.17),rgba(245,130,32,.04) 44%,rgba(14,15,18,.8)),#14171a;border:1px solid rgba(245,130,32,.18);border-radius:22px;padding:24px 28px;box-shadow:var(--shadow);margin-bottom:22px}
    .hero h1{margin:0;font-size:clamp(2rem,4vw,3rem);letter-spacing:-.06em}
    .hero p{margin:6px 0 0;color:var(--muted)}
    .badge{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:rgba(126,231,166,.08);color:var(--green);border:1px solid rgba(126,231,166,.25);font-size:.75rem;font-weight:700}
    .stats-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-bottom:22px}
    .stat-card{background:linear-gradient(180deg,#17191d,#121518);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;box-shadow:0 10px 25px rgba(0,0,0,.12)}
    .stat-value{font-size:clamp(1.8rem,3vw,2.5rem);font-weight:900;letter-spacing:-.05em;margin-top:8px}
    .stat-label{margin-top:6px;color:var(--muted);font-size:.8rem}
    .content-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}
    .card{background:linear-gradient(180deg,#17191d,#121518);border:1px solid var(--line);border-radius:18px;overflow:hidden}
    .card-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
    .card-header h2,.card-header h3{margin:0;font-size:1.08rem}
    .card-body{padding:18px 20px}
    table{width:100%;border-collapse:collapse;font-size:.92rem}
    th,td{text-align:left;vertical-align:top;padding:12px 10px;border-bottom:1px solid var(--line)}
    th{color:var(--muted);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
    .status-badge{display:inline-flex;align-items:center;justify-content:center;padding:5px 10px;border-radius:999px;font-size:.68rem;font-weight:800;text-transform:capitalize}
    .status-badge.pending{background:rgba(245,130,32,.12);color:var(--orange-2)}
    .status-badge.confirmed{background:rgba(126,231,166,.10);color:var(--green)}
    .status-badge.completed{background:rgba(142,197,255,.10);color:var(--blue)}
    .status-badge.cancelled{background:rgba(252,165,165,.12);color:var(--red)}
    .status-badge.submitted,.status-badge.under_review{background:rgba(245,130,32,.10);color:var(--orange-2)}
    .status-badge.verified{background:rgba(126,231,166,.10);color:var(--green)}
    .status-badge.rejected{background:rgba(252,165,165,.12);color:var(--red)}
    .muted{color:var(--muted)}
    .empty{color:var(--muted);padding:18px;border:1px dashed var(--line);border-radius:12px}
    .doc-item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:rgba(255,255,255,.02);margin-bottom:12px}
    .doc-header{display:flex;justify-content:space-between;align-items:center;gap:12px}
    .doc-title{font-weight:700}
    .doc-meta{margin-top:6px;color:var(--muted);font-size:.82rem;line-height:1.65}
    .form-grid{display:grid;gap:12px}
    .field{display:grid;gap:6px}
    .field label{font-size:.82rem;font-weight:750}
    .field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#0d0e10;color:var(--text);outline:none}
    .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(245,130,32,.12)}
    .submit{width:100%;min-height:44px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--orange),var(--orange-2));color:#17110c;font-weight:900;cursor:pointer}
    .alert{display:none;margin:0 0 12px;padding:10px 12px;border:1px solid rgba(255,112,112,.3);border-radius:10px;background:rgba(255,80,80,.08);color:#ffb3b3;font-size:.86rem}
    .alert.visible{display:block}
    .alert.success{border-color:rgba(126,231,166,.3);background:rgba(126,231,166,.08);color:var(--green)}
    @media(max-width:900px){.stats-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.content-grid{grid-template-columns:1fr}}
    @media(max-width:620px){.stats-grid{grid-template-columns:1fr}.hero{flex-direction:column;align-items:flex-start}.topbar-inner{flex-wrap:wrap}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand"><span class="brand-mark">T</span><span>Travlish Client</span></div>
      <div class="header-actions">
        <button class="ghost-btn" id="refreshBtn" type="button">Refresh</button>
        <button class="danger-btn" id="logoutBtn" type="button">Logout</button>
      </div>
    </div>
  </header>
  <main class="main container">
    <section class="hero">
      <div>
        <div class="badge">● Your portal</div>
        <h1 id="welcome">Client portal</h1>
        <p id="welcomeSub">Track your bookings and submit documents for verification.</p>
      </div>
      <a class="ghost-btn" href="/">Back to site</a>
    </section>
    <section class="stats-grid" id="statsGrid"></section>
    <div class="content-grid">
      <section class="card">
        <div class="card-header"><h2>Your bookings</h2></div>
        <div class="card-body"><div id="bookingTableWrap"></div></div>
      </section>
      <section class="card">
        <div class="card-header"><h3>Submit document</h3></div>
        <div class="card-body">
          <div class="alert" id="formAlert"></div>
          <form id="docForm" class="form-grid">
            <div class="field"><label for="bookingId">Booking</label><select id="bookingId" required></select></div>
            <div class="field"><label for="documentType">Document type</label><select id="documentType" required>
              <option value="aadhaar">Aadhaar</option>
              <option value="pan">PAN</option>
              <option value="driver_license">Driver license</option>
              <option value="passport">Passport</option>
            </select></div>
            <div class="field"><label for="documentNumber">Document number</label><input id="documentNumber" required></div>
            <div class="field"><label for="documentName">File / document name</label><input id="documentName" required></div>
            <button class="submit" type="submit">Submit for verification</button>
          </form>
        </div>
      </section>
    </div>
    <section class="card" style="margin-top:20px">
      <div class="card-header"><h3>Your documents</h3></div>
      <div class="card-body"><div id="documentList"></div></div>
    </section>
    <section class="card" style="margin-top:20px">
      <div class="card-header"><h3>Notifications</h3></div>
      <div class="card-body"><div id="notificationList"></div></div>
    </section>
  </main>
  <script>
    const statsGrid=document.getElementById('statsGrid');
    const bookingTableWrap=document.getElementById('bookingTableWrap');
    const documentList=document.getElementById('documentList');
    const notificationList=document.getElementById('notificationList');
    const welcome=document.getElementById('welcome');
    const bookingSelect=document.getElementById('bookingId');
    const formAlert=document.getElementById('formAlert');

    function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function titleCase(v){return String(v||'').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}
    function formatDate(v){if(!v)return '—';const d=new Date(v);return isNaN(d.getTime())?v:d.toLocaleString()}

    function showAlert(msg,ok=false){
      formAlert.textContent=msg;
      formAlert.classList.add('visible');
      formAlert.classList.toggle('success',ok);
      if(ok) setTimeout(()=>{formAlert.classList.remove('visible')},3000);
    }

    function renderStats(bookings,documents){
      const pending=bookings.filter(b=>b.status==='pending').length;
      const cards=[
        {value:bookings.length,label:'Total bookings'},
        {value:pending,label:'Pending approvals'},
        {value:documents.length,label:'Documents submitted'}
      ];
      statsGrid.innerHTML=cards.map(c=>`<div class="stat-card"><div class="stat-value">${c.value}</div><div class="stat-label">${c.label}</div></div>`).join('');
    }

    function renderBookings(bookings){
      if(!bookings.length){bookingTableWrap.innerHTML='<div class="empty">No booking requests yet. Book a car from the home page.</div>';return;}
      bookingTableWrap.innerHTML=`<table><thead><tr><th>Car</th><th>Pickup</th><th>Status</th></tr></thead><tbody>${bookings.map(b=>`<tr><td><div><strong>${escapeHtml(b.car)}</strong></div><div class="muted">#${b.id} · ${escapeHtml(b.customer)}</div></td><td><div>${escapeHtml(b.pickupDate)}</div><div class="muted">${escapeHtml(b.pickup||'—')}</div></td><td><span class="status-badge ${b.status}">${escapeHtml(titleCase(b.status))}</span></td></tr>`).join('')}</tbody></table>`;
    }

    function renderDocuments(docs){
      if(!docs.length){documentList.innerHTML='<div class="empty">No documents submitted yet.</div>';return;}
      documentList.innerHTML=docs.map(d=>`<div class="doc-item"><div class="doc-header"><div class="doc-title">${escapeHtml(titleCase(d.documentType))}</div><span class="status-badge ${d.status}">${escapeHtml(titleCase(d.status))}</span></div><div class="doc-meta">Booking #${escapeHtml(d.bookingId)}<br>Number: ${escapeHtml(d.documentNumber)}<br>Name: ${escapeHtml(d.documentName)}<br>Submitted: ${escapeHtml(formatDate(d.submittedAt))}${d.verificationResult?`<br>Note: ${escapeHtml(d.verificationResult)}`:''}</div></div>`).join('');
    }

    function renderNotifications(items){
      if(!items||!items.length){notificationList.innerHTML='<div class="empty">No notifications yet.</div>';return;}
      notificationList.innerHTML=items.map(n=>`<div class="doc-item"><div class="doc-header"><div class="doc-title">${escapeHtml(n.title)}</div><span class="muted" style="font-size:.75rem">${escapeHtml(formatDate(n.createdAt))}</span></div><div class="doc-meta">${escapeHtml(n.message)}</div></div>`).join('');
    }

    function populateBookingSelect(bookings){
      const prev=bookingSelect.value;
      bookingSelect.innerHTML=bookings.length?bookings.map(b=>`<option value="${b.id}">Booking #${b.id} — ${escapeHtml(b.car)} (${escapeHtml(b.status)})</option>`).join(''):'<option value="">No bookings available</option>';
      if(prev) bookingSelect.value=prev;
    }

    async function loadDashboard(){
      try{
        const res=await fetch('/api/client/dashboard',{credentials:'same-origin'});
        const data=res.ok?await res.json().catch(() => ({})):{bookings:[],documents:[],user:null};
        if(!res.ok) throw new Error(data.error||'Unable to load portal.');
        const bookings=data.bookings||[];
        const documents=data.documents||[];
        welcome.textContent=data.user?`Welcome, ${data.user.name}`:'Client portal';
        renderStats(bookings,documents);
        renderBookings(bookings);
        renderDocuments(documents);
        renderNotifications(data.notifications||[]);
        populateBookingSelect(bookings);
      }catch(e){
        bookingTableWrap.innerHTML=`<div class="empty">${escapeHtml(e.message)}</div>`;
      }
    }

    document.getElementById('docForm').addEventListener('submit',async e=>{
      e.preventDefault();
      const body={
        bookingId:Number(document.getElementById('bookingId').value),
        documentType:document.getElementById('documentType').value,
        documentNumber:document.getElementById('documentNumber').value.trim(),
        documentName:document.getElementById('documentName').value.trim()
      };
      try{
        const res=await fetch('/api/client/document-verification',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),credentials:'same-origin'});
        const result=await res.json().catch(() => ({}));
        if(!res.ok) throw new Error(result.error||'Unable to submit document.');
        showAlert('Document submitted for verification.',true);
        document.getElementById('docForm').reset();
        await loadDashboard();
      }catch(err){showAlert(err.message);}
    });

    document.getElementById('refreshBtn').addEventListener('click',loadDashboard);
    document.getElementById('logoutBtn').addEventListener('click',async()=>{
      try{await fetch('/auth/logout',{method:'POST',credentials:'same-origin'});}catch{}
      document.cookie='travlish_session=; Max-Age=0; path=/';
      window.location.href='/Client/login.html';
    });
    loadDashboard();
  </script>
</body>
</html>
